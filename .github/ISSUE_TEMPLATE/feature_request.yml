name: Feature request
description: Suggest an improvement for FocusFlow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first and explain the user problem this would solve.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: I find it difficult to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      placeholder: Describe the behavior or experience you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative approaches have you tried?
  - type: input
    id: context
    attributes:
      label: Device or context
      description: Optional Android version, device, or workflow details.